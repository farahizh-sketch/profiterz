<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automate: send alerts to my webhook</title>
<style>
  :root { --bg:#f3f5f7; --ink:#14202b; --muted:#5d6b78; --line:#cfd8e0; --accent:#0a7d5a; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10171d; --ink:#e6edf3; --muted:#8b9aa8; --line:#2a3743; --accent:#3ecf9b; --err:#ff8a80; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 Georgia,"Times New Roman",serif; }
  main { max-width:560px; margin:0 auto; padding:10vh 20px 40px; }
  h1 { font-size:2rem; line-height:1.2; margin:0 0 12px; }
  p { color:var(--muted); margin:0 0 24px; }
  input, button { font:inherit; padding:12px 14px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--ink); }
  input { width:100%; margin-bottom:12px; }
  input:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; margin-right:8px; }
  button.ghost { background:transparent; color:var(--ink); border-color:var(--line); }
  ul { list-style:none; padding:0; margin:28px 0 0; }
  li { display:flex; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
  li span { flex:1; overflow-wrap:anywhere; }
  li button { margin:0; padding:6px 10px; }
  #msg { margin-top:14px; min-height:1.5em; } .ok{color:var(--accent)} .err{color:var(--err)}
  .hide { display:none; }
</style>
</head>
<body>
<main>
  <!-- logged out -->
  <section id="auth">
    <h1>Log in to receive alerts</h1>
    <p>Log in with the details your admin gave you, then add the webhook that should receive each alert.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="pass" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">
    <button id="login">Log in</button>
  </section>

  <!-- logged in -->
  <section id="app" class="hide">
    <h1>Your webhooks</h1>
    <p id="who"></p>
    <input id="url" type="url" placeholder="https://example.com/my-webhook" aria-label="Webhook URL">
    <button id="add">Add webhook</button><button id="logout" class="ghost">Log out</button>
    <ul id="list"></ul>
  </section>
  <div id="msg" role="status"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Safe to expose: the anon key is protected by the row-level security policy.
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-KEY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
const say = (t, ok) => { $("msg").textContent = t || ""; $("msg").className = ok ? "ok" : "err"; };

async function refresh() {
  const { data: { session } } = await sb.auth.getSession();
  $("auth").classList.toggle("hide", !!session);
  $("app").classList.toggle("hide", !session);
  if (!session) return;
  $("who").textContent = "Signed in as " + session.user.email;
  const { data, error } = await sb.from("webhooks").select("*").order("created_at");
  if (error) return say(error.message);
  const ul = $("list"); ul.innerHTML = "";
  data.forEach((w) => {
    const li = document.createElement("li");
    const s = document.createElement("span"); s.textContent = w.url + (w.active ? "" : " (paused)");
    const t = document.createElement("button"); t.className = "ghost"; t.textContent = w.active ? "Pause" : "Resume";
    t.onclick = async () => { await sb.from("webhooks").update({ active: !w.active }).eq("id", w.id); refresh(); };
    const d = document.createElement("button"); d.className = "ghost"; d.textContent = "Delete";
    d.onclick = async () => { await sb.from("webhooks").delete().eq("id", w.id); refresh(); };
    li.append(s, t, d); ul.append(li);
  });
}

$("login").onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value, password: $("pass").value });
  error ? say(error.message) : (say(""), refresh());
};
$("logout").onclick = async () => { await sb.auth.signOut(); refresh(); };
$("add").onclick = async () => {
  const url = $("url").value.trim();
  if (!url.startsWith("https://")) return say("Webhook must start with https://");
  const { error } = await sb.from("webhooks").insert({ url });
  if (error) return say(error.code === "23505" ? "That webhook is already added." : error.message);
  $("url").value = ""; say("Webhook added. You will receive new alerts.", true); refresh();
};
sb.auth.onAuthStateChange(refresh);
refresh();
</script>
</body>
</html>
